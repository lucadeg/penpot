
name: "MCP CI"

on:
  workflow_dispatch:
  # Automatic triggers removed; invoke through FounderOS/Admin Gate.
jobs:
  test-mcp:
    if: ${{ !github.event.pull_request.draft }}
    name: "Test MCP"
    runs-on: penpot-runner-02
    container: penpotapp/devenv:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup
        working-directory: ./mcp
        run: ./scripts/setup

      - name: Check
        working-directory: ./mcp
        run: |
          pnpm run fmt:check;
          pnpm -r run build;
          pnpm -r run types:check;
